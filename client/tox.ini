[tox]
env_list = format, lint, unit

[testenv:format]
description = Apply coding style standards to code
skip_install = true
deps =
    ruff
commands =
    ruff check --fix
    ruff format

[testenv:lint]
description = Check code against coding style standards
skip_install = true
deps =
    ruff
commands =
    ruff check
    ruff format --check

[testenv:unit]
description = Run unit tests
deps =
    pytest
commands =
    pytest pytests
