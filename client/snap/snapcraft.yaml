name: hwctl
adopt-info: hwctl
license: GPL-3.0-only
title: Ubuntu Certified
summary: Check if your computer is Ubuntu Certified
description: |
  Ubuntu Certified devices are tested for reliability and performance, ensuring the best Ubuntu experience.

  To check if your computer is Ubuntu Certified:

  - On Ubuntu, install this and go to `Settings > System > Ubuntu Certified`.
  - On any Linux distribution, run `hwctl` in the terminal.

  The Hardware API server is available at https://hw.ubuntu.com.

  You can view the Hardware API OpenAPI schema at https://ubuntu.com/docs/hardware-api/latest/reference/openapi/.

website: https://ubuntu.com/docs/hardware-api/latest
source-code: https://github.com/canonical/hardware-api/tree/main/client
issues: https://github.com/canonical/hardware-api/issues
contact: https://github.com/canonical/hardware-api/issues

base: core24
grade: stable
confinement: strict

platforms:
  amd64:

apps:
  hwctl-daemon:
    command: bin/hwctl-daemon
    plugs:
      - hardware-observe
      - kernel-module-observe
      - network
      - network-bind
      - network-setup-observe
      - system-observe
    daemon: simple
    sockets:
      hwctl-socket:
        listen-stream: $SNAP_COMMON/hwctl.varlink

  hwctl:
    command: bin/hwctl

parts:
  hwctl:
    plugin: rust
    rust-features: ["cli"]
    source: .
    build-packages:
      - jq
      - libssl-dev
      - pkg-config
    stage-packages:
      - kmod
      - jq
    override-pull: |
      craftctl default
      metadata="$(cargo metadata --no-deps --format-version 1)"
      version="$(echo "$metadata" | jq -r .packages[0].version)"
      craftctl set version="$version"
    build-environment:
      - OS_RELEASE_FILE_PATH: /var/lib/snapd/hostfs/etc/os-release
    override-build: |
      craftctl default
      cp hwctl.1 $CRAFT_PART_INSTALL/hwctl.1
    organize:
      # Snap does not support manpages. In order to enable them, execute:
      # sudo ln -s /snap/hwctl/current/man/man1/hwctl.1 /usr/share/man/man1/hwctl.1
      hwctl.1: man/man1/hwctl.1
