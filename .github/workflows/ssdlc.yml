name: SSDLC
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * 0"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  scan:
    name: Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # post security scan results
      pull-requests: write # comment on the pull request
      packages: read # fetch GHCR image
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan
        uses: canonical/reposcan@760e06d3db4a95bba2697fd586aa815975682428 # v0.2.1
        with:
          pr-comment: ${{ github.event_name == 'pull_request' }}
          image: ${{ github.event_name == 'pull_request' && 'build' || 'canonical' }}
          sbom: ${{ github.ref == 'refs/heads/main' }}
