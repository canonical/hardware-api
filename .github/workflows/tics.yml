name: TiCS
permissions: {}
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * 0"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  analyze:
    name: TiCS Analysis
    runs-on: [self-hosted, linux, amd64, noble, tiobe]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo snap install --classic just
      - name: Install dependencies
        run: |
          just --yes client::setup
          sudo apt-get install -y pipx python3-maturin

      # Client
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Gather coverage (client)
        working-directory: client
        run: just unit --output coverage.xml
      - name: Build (client)
        working-directory: client
        run: just build
      - name: Install (client pybindings)
        working-directory: client
        run: pip install . --break-system-packages

      # Server
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Gather coverage (server)
        working-directory: server
        run: just test
      - name: Install (server)
        working-directory: server
        run: |
          uv export --no-emit-project --frozen --no-hashes --all-groups > requirements.txt
          pip install -r requirements.txt --break-system-packages

      - name: Combine coverage
        run: |
          mkdir .coverage/
          mv client/coverage.xml .coverage/client_coverage.xml
          mv server/coverage/coverage.xml .coverage/server_coverage.xml

      - name: Run TiCS Analysis
        uses: tiobe/tics-github-action@333078bc527399e5916a166bd1a3a788be5a01a9 # v3.12.0
        with:
          mode: qserver
          project: hardware-api
          branchdir: .
          viewerUrl: https://canonical.tiobe.com/tiobeweb/TICS/api/cfg?name=default
          ticsAuthToken: ${{ secrets.TICSAUTHTOKEN }}
          installTics: true
